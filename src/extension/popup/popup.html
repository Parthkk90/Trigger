<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trigger</title>
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; connect-src 'self' http://localhost:8787 https:;">
  <link rel="stylesheet" href="../styles/tokens.css">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 340px;
      font-family: var(--trigger-font-stack);
      background: linear-gradient(180deg, #f7f9ff 0%, #f2f5fb 100%);
      color: var(--trigger-color-text-primary);
    }

    button:focus-visible {
      outline: none;
      box-shadow: var(--trigger-focus-ring);
    }

    .shell {
      padding: var(--trigger-space-4);
      display: grid;
      gap: var(--trigger-space-3);
    }

    .header {
      display: flex;
      align-items: center;
      gap: var(--trigger-space-2);
    }

    .brand-mark {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at 35% 35%, #5ea2ff, var(--trigger-color-primary));
      color: #ffffff;
      font-weight: 700;
      font-size: 16px;
    }

    .header h1 {
      font-size: 17px;
      font-weight: 700;
      letter-spacing: -0.2px;
    }

    .header .version {
      font-size: 11px;
      color: var(--trigger-color-text-secondary);
      margin-left: auto;
    }

    .settings-btn {
      width: 44px;
      height: 44px;
      border: 1px solid var(--trigger-color-border);
      border-radius: var(--trigger-radius-md);
      background: var(--trigger-color-surface);
      color: var(--trigger-color-text-primary);
      font-size: 18px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .settings-btn:hover {
      border-color: #9fb6dd;
      background: #eef4ff;
    }

    .controls {
      display: grid;
      gap: var(--trigger-space-2);
    }

    .btn {
      min-height: 44px;
      padding: 0 var(--trigger-space-4);
      border: 1px solid transparent;
      border-radius: var(--trigger-radius-md);
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .btn-record {
      background: var(--trigger-color-primary);
      color: #fff;
      box-shadow: 0 8px 18px rgba(15, 98, 254, 0.24);
    }

    .btn-record:hover:not(:disabled) {
      background: var(--trigger-color-primary-hover);
    }

    .btn-record.active {
      background: #9f1853;
      animation: recordPulse 1.5s infinite;
    }

    @keyframes recordPulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(159, 24, 83, 0.35); }
      50% { box-shadow: 0 0 0 6px rgba(159, 24, 83, 0); }
    }

    .btn-stop {
      background: #374151;
      color: #fff;
    }

    .btn-stop:hover:not(:disabled) {
      background: #1f2937;
    }

    .status-bar {
      padding: var(--trigger-space-3);
      font-size: 12px;
      color: var(--trigger-color-text-secondary);
      background: var(--trigger-color-surface);
      border: 1px solid var(--trigger-color-border);
      border-radius: var(--trigger-radius-md);
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
    }
    .status-dot.idle { background: #9ca3af; }
    .status-dot.recording { background: #dc2626; animation: pulse 1s infinite; }
    .status-dot.replaying { background: #4f46e5; animation: pulse 1s infinite; }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    .notice {
      padding: 8px 10px;
      border-radius: var(--trigger-radius-sm);
      font-size: 12px;
      line-height: 1.35;
      border: 1px solid;
      word-break: break-word;
      display: none;
    }
    .notice.info {
      background: #eff6ff;
      border-color: #bfdbfe;
      color: #1d4ed8;
    }
    .notice.success {
      background: #ecfdf5;
      border-color: #a7f3d0;
      color: #047857;
    }
    .notice.error {
      background: #fef2f2;
      border-color: #fecaca;
      color: #b91c1c;
    }

    .workflows {
      padding: var(--trigger-space-3);
      background: var(--trigger-color-surface);
      border: 1px solid var(--trigger-color-border);
      border-radius: var(--trigger-radius-md);
      max-height: 300px;
      overflow-y: auto;
    }

    .workflows h2 {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: var(--trigger-color-text-secondary);
      margin-bottom: var(--trigger-space-2);
    }

    .workflow-item {
      display: flex;
      align-items: center;
      gap: var(--trigger-space-2);
      padding: var(--trigger-space-2);
      background: #fbfcff;
      border: 1px solid var(--trigger-color-border);
      border-radius: var(--trigger-radius-sm);
      margin-bottom: var(--trigger-space-2);
      cursor: default;
      transition: all 0.15s;
    }

    .workflow-item:hover {
      border-color: #afc5ea;
      background: #f3f7ff;
    }

    .workflow-info {
      flex: 1;
      min-width: 0;
    }

    .workflow-name {
      font-size: 13px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .workflow-meta {
      font-size: 11px;
      color: var(--trigger-color-text-secondary);
      margin-top: 2px;
    }

    .workflow-actions {
      display: flex;
      gap: 4px;
    }

    .workflow-actions button {
      width: 44px;
      height: 44px;
      border: 1px solid transparent;
      border-radius: var(--trigger-radius-sm);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      transition: all 0.15s;
    }

    .btn-play {
      background: #eaf2ff;
      color: #0f62fe;
      border-color: #bfd4ff;
    }

    .btn-play:hover {
      background: #d5e6ff;
    }

    .btn-delete {
      background: #fef2f2;
      color: #dc2626;
      border-color: #fecaca;
    }

    .btn-delete:hover {
      background: #fecaca;
    }

    .btn-share {
      background: #eefcf8;
      color: #0f766e;
      border-color: #a7f3d0;
    }

    .btn-share:hover {
      background: #d1fae5;
    }

    .empty-state {
      text-align: center;
      padding: 30px 16px;
      color: var(--trigger-color-text-secondary);
      font-size: 13px;
    }

    .empty-state .icon {
      font-size: 32px;
      margin-bottom: var(--trigger-space-2);
    }
  </style>
</head>
<body>
  <div class="shell">
    <div class="header">
      <span class="brand-mark" aria-hidden="true">⚡</span>
      <h1>Trigger</h1>
      <span class="version">Home</span>
      <button class="settings-btn" id="btn-settings" title="Open Settings" aria-label="Open Settings">⚙</button>
    </div>

    <div class="controls" id="controls">
      <button class="btn btn-record" id="btn-record">
        <span aria-hidden="true">●</span> Record
      </button>
    </div>

    <div class="status-bar" id="status-bar" role="status" aria-live="polite">
      <div class="status-dot idle" id="status-dot"></div>
      <span id="status-text">Ready</span>
    </div>

    <div class="notice" id="notice" role="status" aria-live="polite"></div>

    <div class="workflows" id="workflows">
      <h2>Saved Workflows</h2>
      <div id="workflow-list"></div>
    </div>

    <div class="settings-panel" id="settings-panel" style="display: none;">
      <div class="header" style="margin-bottom: var(--trigger-space-3);">
        <button class="settings-btn" id="btn-back" title="Back to Workflows" aria-label="Back to Workflows">←</button>
        <h2 style="font-size: 15px; text-transform: none; margin: 0;">Settings</h2>
      </div>
      
      <div class="field" style="margin-bottom: var(--trigger-space-3);">
        <label for="backend-url" style="display: block; font-size: 11px; font-weight: 600; color: var(--trigger-color-text-secondary); margin-bottom: 4px;">BACKEND URL</label>
        <input type="text" id="backend-url" placeholder="e.g. http://localhost:8787" style="width: 100%; padding: 8px 10px; border: 1px solid var(--trigger-color-border); border-radius: var(--trigger-radius-sm); font-size: 13px;">
      </div>

      <div class="field" style="margin-bottom: var(--trigger-space-3);">
        <label for="viewer-url" style="display: block; font-size: 11px; font-weight: 600; color: var(--trigger-color-text-secondary); margin-bottom: 4px;">VIEWER URL (FALLBACK)</label>
        <input type="text" id="viewer-url" placeholder="e.g. http://localhost:8080" style="width: 100%; padding: 8px 10px; border: 1px solid var(--trigger-color-border); border-radius: var(--trigger-radius-sm); font-size: 13px;">
      </div>

      <div class="field" style="margin-bottom: var(--trigger-space-4);">
        <label for="api-token" style="display: block; font-size: 11px; font-weight: 600; color: var(--trigger-color-text-secondary); margin-bottom: 4px;">API TOKEN</label>
        <input type="password" id="api-token" placeholder="Bearer token for authentication" style="width: 100%; padding: 8px 10px; border: 1px solid var(--trigger-color-border); border-radius: var(--trigger-radius-sm); font-size: 13px;">
      </div>

      <button class="btn btn-record" id="btn-save-settings" style="width: 100%;">Save Settings</button>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
